<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --green-600: #479770;
        --green-soft: #d9f2e5;
        --cta: #10b981;
        --bg: #f5faf7; --ink: #0d1a14; --muted: #5b6b63; --line: #e3ece7; --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b120f; --ink: #eef5f1; --muted: #9db0a6; --line: #1d2a23; --card: #131f19; --green-soft: #173024; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; min-height: 100dvh;
        background: var(--bg); color: var(--ink);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex; justify-content: center;
        padding: max(48px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      }
      main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(13, 26, 20, .14); }
      h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: -.03em; margin: 18px 0 6px; }
      .handle { color: var(--muted); font-weight: 500; margin: 0 0 6px; }
      .tag { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
      nav { width: 100%; display: grid; gap: 12px; }
      a.link {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        min-height: 58px; padding: 14px 20px; border-radius: 16px;
        font-weight: 700; font-size: 1.02rem; text-decoration: none;
        background: var(--card); color: var(--ink); border: 1px solid var(--line);
        transition: transform .15s ease, box-shadow .15s ease;
      }
      a.link.primary { background: var(--cta); color: #fff; border-color: transparent; }
      a.link:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(13, 26, 20, .1); }
      a.link:active { transform: scale(.98); }
      a.link:focus-visible { outline: 3px solid var(--green-600); outline-offset: 3px; }
      a.link svg { width: 20px; height: 20px; flex: none; }
      .mascot { width: 150px; margin-top: 36px; opacity: .95; }
      footer { margin-top: 20px; font-size: .85rem; color: var(--muted); }
      @media (prefers-reduced-motion: reduce) { a.link { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/public/nutri-app-icon.png" alt="Nutrio+ app icon" width="96" height="96" />
      <h1>Nutrio+</h1>

      <p class="tag">Snap a photo of your meal and it logs everything for you.</p>
      <nav aria-label="Links">

          Download on the App Store
        </a>
        <a class="link" href="https://nutrioplus.co.uk/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Nutrio+ website
        </a>
      </nav>
      <img class="mascot" src="/public/m-hero.png" alt="" width="150" height="119" />
      <footer>iPhone · 3-day free trial</footer>
    </main>
  </body>
</html>
